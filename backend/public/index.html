<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skyy-CRM Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; gap: 20px; }
        .form-container { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 300px; height: fit-content; border: 1px solid #334155; }
        .list-container { flex-grow: 1; background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        input, select { width: 100%; padding: 10px; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-delete { background: #f87171; width: auto; padding: 5px 10px; margin-left: 5px; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #0f172a; border: 1px solid #475569; color: white; cursor: pointer; }

        /* 1. Fix the height of the list and add a scrollbar */
        .list-container {
            flex-grow: 1;
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            height: 85vh; /* Takes up most of the screen height */
            display: flex;
            flex-direction: column;
        }

        /* 2. Keep the Search bar at the very top */
        #search {
            position: sticky;
            top: 0;
            z-index: 20;
            margin-bottom: 1rem;
        }

        /* 3. The magic: Make the table scrollable but the header sticky */
        .table-wrapper {
            overflow-y: auto;
            flex-grow: 1;
        }

        /* 1. Reset the table to handle sticky borders properly */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        /* 2. Style the headers */
        thead th {
            position: sticky;
            top: 0;
            background: #1e293b; /* Must match container background */
            z-index: 10;
            padding: 12px;
            text-align: left;
            color: #38bdf8;
            border: none; /* Remove the old border property */
        }

        /* 3. The "Pseudo-Line" - This stays visible during scroll! */
        thead th::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            border-bottom: 2px solid #38bdf8;
        }

        /* 4. Ensure cells have a background so they don't overlap messy */
        td {
            background: #1e293b;
            padding: 12px;
            border-bottom: 1px solid #334155;
        }

    </style>
</head>
<body>

    <div class="form-container">
        <h2>🚀 New Lead</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="company" placeholder="Company">
        <button onclick="saveContact()">Add Lead</button>
    </div>

<div class="list-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>📂 Database</h2>
        <button onclick="logout()" style="width: auto; background: #64748b; padding: 5px 15px;">Logout</button>
    </div>
    
    <input type="text" id="search" placeholder="🔍 Search leads by name..." onkeyup="filterContacts()">
    
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Contact Info</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contact-list"></tbody>
        </table>
    </div>
</div>

    <script>
        // 1. Security Guard: Check for token on page load
        if (!localStorage.getItem('skyy_token')) {
            window.location.href = '/login.html';
        }

        // 2. Logout function
        function logout() {
            localStorage.removeItem('skyy_token');
            window.location.href = '/login.html';
        }

        let allContacts = [];

        // Helper to get headers with the Token
        const getAuthHeaders = () => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('skyy_token')}`
        });

        async function loadContacts() {
            const response = await fetch('/api/contacts', {
                headers: getAuthHeaders() // Added token to request
            });
            
            if (response.status === 401) logout(); // Kick out if token expired
            
            allContacts = await response.json();
            renderTable(allContacts);
        }

        function renderTable(data) {
            const list = document.getElementById('contact-list');
            list.innerHTML = '';
            data.forEach(c => {
                list.innerHTML += `
                    <tr>
                        <td>
                            <strong>${c.name}</strong><br>
                            <small style="color:#94a3b8">${c.email} | ${c.company || 'No Company'}</small>
                            <div style="margin-top: 5px; font-size: 0.8rem;">
                                ${c.notes && c.notes.length > 0 ? 
                                    `Latest: ${c.notes[c.notes.length - 1]} 
                                    <br><a href="#" onclick="alert('${c.notes.join('\\n')}'); return false;" style="color:#38bdf8">View All (${c.notes.length})</a>` 
                                    : '<span style="color:#475569">No notes</span>'}
                            </div>
                        </td>
                        <td>
                            <select onchange="updateStatus('${c._id}', this.value)" class="status-tag">
                                <option value="New" ${c.status === 'New' ? 'selected' : ''}>New</option>
                                <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Closed" ${c.status === 'Closed' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                        <td>
                            <button style="background: #38bdf8; width: auto; padding: 5px 10px;" onclick="addNote('${c._id}')">📝 Note</button>
                            <button style="background: #eab308; width: auto; padding: 5px 10px;" onclick="editContact('${c._id}', '${c.name}', '${c.email}', '${c.company}')">✏️ Edit</button>
                            <button class="btn-delete" onclick="deleteContact('${c._id}')">🗑️ Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterContacts() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allContacts.filter(c => c.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        async function saveContact() {
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                company: document.getElementById('company').value,
                status: "New"
            };
            await fetch('/api/contacts', {
                method: 'POST',
                headers: getAuthHeaders(), // Added token to request
                body: JSON.stringify(data)
            });
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('company').value = '';
            loadContacts();
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/contacts/${id}`, {
                method: 'PUT',
                headers: getAuthHeaders(), // Added token to request
                body: JSON.stringify({ status: newStatus })
            });
            loadContacts();
        }

        async function editContact(id, oldName, oldEmail, oldCompany) {
            const newName = prompt("Edit Name:", oldName);
            const newEmail = prompt("Edit Email:", oldEmail);
            const newCompany = prompt("Edit Company:", oldCompany);

            if (newName && newEmail) {
                await fetch(`/api/contacts/edit/${id}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ 
                        name: newName, 
                        email: newEmail, 
                        company: newCompany 
                    })
                });
                loadContacts();
            }
        }

        async function deleteContact(id) {
            if(confirm("Are you sure you want to delete this lead?")) {
                await fetch(`/api/contacts/${id}`, { 
                    method: 'DELETE',
                    headers: getAuthHeaders() // Added token to request
                });
                loadContacts();
            }
        }

        async function addNote(id) {
            const note = prompt("Enter your note:");
            if (note) {
                await fetch(`/api/contacts/${id}/notes`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ note })
                });
                loadContacts();
            }
        }

        loadContacts();
    </script>
</body>
</html>
